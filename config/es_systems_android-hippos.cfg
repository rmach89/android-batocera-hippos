<?xml version="1.0"?>
<!-- HippOS only (linked as es_systems_android.cfg by install.sh).
     Takes over HippOS's own Android systems instead of adding a second one:
     only the tags given here replace HippOS's; everything else (name, theme, logo) stays.
     Android Games: your .apk files (installed on first launch) + every installed game (.android)
     Android Apps:  .apk apps + the Waydroid (Android home screen) entry -->
<systemList>
  <system>
    <name>androidgames</name>
    <extension>.apk .APK .android</extension>
    <command>/userdata/system/add-ons/android/bin/android-launch %ROM%</command>
  </system>
  <system>
    <name>androidapps</name>
    <extension>.apk .APK .waydroid</extension>
    <command>/userdata/system/add-ons/android/bin/android-launch %ROM%</command>
  </system>
</systemList>
